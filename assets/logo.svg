<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0.38"/>
      <stop offset="45%" stop-color="#c40028" stop-opacity="0.16"/>
      <stop offset="75%" stop-color="#1a0408" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Red Gradients -->
    <linearGradient id="redMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="25%" stop-color="#ff1e42"/>
      <stop offset="50%" stop-color="#e60028"/>
      <stop offset="75%" stop-color="#a8001a"/>
      <stop offset="100%" stop-color="#5a000e"/>
    </linearGradient>

    <linearGradient id="redBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="15%" stop-color="#ff8598" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ff1e42" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3d0007" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Chrome / Silver Gradient for T -->
    <linearGradient id="silverChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Glowing Red Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3355"/>
      <stop offset="30%" stop-color="#ff1e42"/>
      <stop offset="70%" stop-color="#d90429"/>
      <stop offset="100%" stop-color="#7a0014"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow3d">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Ambient background glow behind logo -->
  <circle cx="250" cy="250" r="220" fill="url(#bgGlow)" />

  <!-- Outer Neon Rings / Arcs (RTN circular frame) -->
  <g filter="url(#neonGlow)">
    <!-- Top curved neon swooshes -->
    <path d="M 120 180 A 180 180 0 0 1 380 180" fill="none" stroke="#ff1e42" stroke-width="4.5" stroke-linecap="round" opacity="0.95"/>
    <path d="M 90 220 A 195 195 0 0 1 410 220" fill="none" stroke="#ff1e42" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <!-- Bottom thick curved ring -->
    <path d="M 100 290 A 190 190 0 0 0 400 290" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 130 330 A 165 165 0 0 0 370 330" fill="none" stroke="#ff1e42" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Specular top highlight on bottom ring -->
  <path d="M 115 288 A 188 188 0 0 0 385 288" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" stroke-dasharray="120 60 180"/>

  <!-- Center 3D Monogram: R T N -->
  <g filter="url(#shadow3d)" transform="translate(0, -10)">
    <!-- 'R' (Red metallic 3D) -->
    <path d="M 75 190 L 155 190 C 185 190 205 202 205 228 C 205 248 190 260 170 266 L 205 315 L 165 315 L 138 274 L 105 274 L 105 315 L 75 315 Z M 105 214 L 105 252 L 150 252 C 165 252 175 245 175 233 C 175 221 165 214 150 214 Z"
          fill="url(#redMetallic)"/>
    <!-- R Bevel overlay -->
    <path d="M 75 190 L 155 190 C 185 190 205 202 205 228 C 205 248 190 260 170 266 L 205 315 L 165 315 L 138 274 L 105 274 L 105 315 L 75 315 Z M 105 214 L 105 252 L 150 252 C 165 252 175 245 175 233 C 175 221 165 214 150 214 Z"
          fill="url(#redBevel)" mix-blend-mode="overlay" opacity="0.85"/>

    <!-- 'T' (Silver Chrome metallic 3D center) -->
    <path d="M 210 190 L 305 190 L 292 216 L 268 216 L 246 315 L 218 315 L 240 216 L 216 216 Z"
          fill="url(#silverChrome)"/>
    <!-- T Bevel center crease -->
    <path d="M 257 190 L 257 216 L 232 315 L 235 315 L 260 216 L 305 190 Z"
          fill="#ffffff" opacity="0.35"/>

    <!-- 'N' (Red metallic 3D) -->
    <path d="M 305 190 L 338 190 L 382 268 L 396 190 L 425 190 L 405 315 L 372 315 L 328 237 L 314 315 L 285 315 Z"
          fill="url(#redMetallic)"/>
    <!-- N Bevel overlay -->
    <path d="M 305 190 L 338 190 L 382 268 L 396 190 L 425 190 L 405 315 L 372 315 L 328 237 L 314 315 L 285 315 Z"
          fill="url(#redBevel)" mix-blend-mode="overlay" opacity="0.85"/>
  </g>

  <!-- Specular Lens Glint on RTN -->
  <circle cx="165" cy="188" r="4" fill="#ffffff" filter="url(#subtleGlow)"/>
  <circle cx="258" cy="188" r="5" fill="#ffffff" filter="url(#subtleGlow)"/>
  <circle cx="390" cy="188" r="4" fill="#ffffff" filter="url(#subtleGlow)"/>

  <!-- Sub-banner: BACKUP GROUP -->
  <g transform="translate(0, 10)">
    <!-- Left speed line wing -->
    <line x1="70" y1="344" x2="115" y2="344" stroke="#ff1e42" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="350" x2="110" y2="350" stroke="#ff1e42" stroke-width="2" stroke-linecap="round"/>

    <!-- Text: BACKUP in bold red neon, GROUP in white/silver -->
    <text x="130" y="352" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="28" fill="#ff1e42" letter-spacing="2" filter="url(#subtleGlow)">BACKUP</text>
    <text x="270" y="352" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-style="italic" font-size="28" fill="#f1f5f9" letter-spacing="3">GROUP</text>

    <!-- Right speed line wing -->
    <line x1="390" y1="344" x2="435" y2="344" stroke="#ff1e42" stroke-width="3" stroke-linecap="round"/>
    <line x1="395" y1="350" x2="425" y2="350" stroke="#ff1e42" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Tagline: RATAN MAJUMDER DESIGNER NICE -->
  <g transform="translate(0, 32)">
    <line x1="120" y1="368" x2="155" y2="368" stroke="#ff3355" stroke-width="1.2" opacity="0.6"/>
    <text x="250" y="372" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="11.5" fill="#e2e8f0" letter-spacing="4" opacity="0.9">RATAN MAJUMDER DESIGNER NICE</text>
    <line x1="345" y1="368" x2="380" y2="368" stroke="#ff3355" stroke-width="1.2" opacity="0.6"/>
  </g>
</svg>
