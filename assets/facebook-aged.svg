<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05122b"/>
      <stop offset="50%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1d4ed8" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="600" height="340" rx="16" fill="url(#bg)"/>
  <circle cx="300" cy="140" r="160" fill="url(#glow)"/>

  <!-- FB / 2FA Shield Icon -->
  <g filter="url(#shadow)" transform="translate(300, 130)">
    <circle cx="0" cy="0" r="54" fill="#081836" stroke="#3b82f6" stroke-width="3"/>
    <path d="M 0 -28 L 22 -14 L 22 8 C 22 22 0 32 0 32 C 0 32 -22 22 -22 8 L -22 -14 Z" fill="none" stroke="url(#neonBlue)" stroke-width="4"/>
    <path d="M -8 2 L -2 8 L 8 -4" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Badges -->
  <rect x="36" y="28" width="130" height="26" rx="6" fill="rgba(59,130,246,0.18)" stroke="#3b82f6" stroke-width="1"/>
  <text x="101" y="45" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">AGED 2018-2021</text>

  <rect x="420" y="28" width="144" height="26" rx="6" fill="rgba(0,230,118,0.18)" stroke="#00e676" stroke-width="1"/>
  <text x="492" y="45" fill="#00e676" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">🛡️ 2FA VERIFIED</text>

  <!-- Titles -->
  <text x="300" y="235" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800" text-anchor="middle">Facebook Old Accounts Bulk</text>
  <text x="300" y="265" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13.5" font-weight="500" text-anchor="middle">High Trust Score · 2FA Secret Key · Excel Format</text>

  <!-- Rate Chip -->
  <rect x="230" y="276" width="140" height="30" rx="15" fill="url(#neonBlue)"/>
  <text x="300" y="296" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">৳65.00 / UNIT</text>
</svg>
